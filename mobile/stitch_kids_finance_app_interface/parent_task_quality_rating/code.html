<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parent Task Detail with Quality Rating</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#332f39",
                        "primary-container": "#7c3aed",
                        "tertiary-fixed": "#ffddb8",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary": "#704500",
                        "error-container": "#ffdad6",
                        "background": "#fef7ff",
                        "primary-fixed": "#eaddff",
                        "on-secondary-container": "#00714d",
                        "on-primary-fixed": "#25005a",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c49",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f9f1ff",
                        "surface-container-highest": "#e8dfee",
                        "outline-variant": "#ccc3d8",
                        "on-error-container": "#93000a",
                        "outline": "#7b7487",
                        "surface-tint": "#732ee4",
                        "primary-fixed-dim": "#d2bbff",
                        "inverse-on-surface": "#f6eefc",
                        "surface-dim": "#dfd7e6",
                        "surface": "#fef7ff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container-high": "#ede5f4",
                        "on-primary-fixed-variant": "#5a00c6",
                        "on-primary-container": "#ede0ff",
                        "on-background": "#1d1a24",
                        "surface-variant": "#e8dfee",
                        "surface-container": "#f3ebfa",
                        "on-surface": "#1d1a24",
                        "on-secondary-fixed": "#002113",
                        "surface-bright": "#fef7ff",
                        "primary": "#630ed4",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-surface-variant": "#4a4455",
                        "on-secondary-fixed-variant": "#005236",
                        "tertiary-container": "#905b00",
                        "secondary-fixed-dim": "#4edea3",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#ffe1c0",
                        "inverse-primary": "#d2bbff",
                        "error": "#ba1a1a",
                        "brand-blue": "#1E88E5"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "lg": "24px",
                        "2xl": "48px",
                        "sidebar-width": "280px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "container-max": "1440px",
                        "unit": "4px",
                        "md": "16px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-md": ["Inter"],
                        "mono": ["ui-monospace"],
                        "headline-sm": ["Inter"]
                    },
                    fontSize: {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "display-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "mono": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        };
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex justify-center items-start pt-8 pb-24 md:pt-16 font-body-lg">
<div class="w-full max-w-md px-4">
<!-- Header -->
<header class="flex items-center justify-between mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Chi tiết nhiệm vụ</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Task Context Summary -->
<div class="bg-brand-blue text-white rounded-2xl p-6 mb-6 shadow-sm relative overflow-hidden">
<!-- Decorative circle -->
<div class="absolute -right-8 -top-8 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
<div class="relative z-10">
<div class="flex items-start justify-between mb-2">
<h2 class="font-display-md text-display-md">Dọn dẹp phòng ngủ</h2>
<span class="material-symbols-outlined text-3xl">cleaning_services</span>
</div>
<div class="flex items-center gap-2 mt-4 text-white/90">
<div class="flex items-center gap-1 bg-white/20 px-3 py-1.5 rounded-full font-label-md text-label-md backdrop-blur-sm">
<span class="material-symbols-outlined text-sm">schedule</span>
<span>Hoàn thành: 14:30</span>
</div>
</div>
</div>
</div>
<!-- Rating Section -->
<div class="bg-surface-container-lowest rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-outline-variant/30 p-6">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-brand-blue">star_half</span>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Đánh giá chất lượng hoàn thành</h3>
</div>
<!-- Rating Cards Grid -->
<div class="grid grid-cols-3 gap-3 mb-8">
<!-- Option 1: Basic -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/50 hover:bg-surface-container transition-colors relative group focus:outline-none">
<div class="text-3xl mb-2 group-hover:scale-110 transition-transform">😐</div>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center">Làm cho xong</div>
<div class="font-label-md text-label-md text-amber-600 mt-1">80% xu</div>
</button>
<!-- Option 2: Good (Selected by default) -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-brand-blue bg-brand-blue/10 relative group focus:outline-none">
<!-- Check mark badge -->
<div class="absolute -top-2 -right-2 w-6 h-6 bg-brand-blue text-white rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<div class="text-3xl mb-2 scale-110">🙂</div>
<div class="font-label-sm text-label-sm text-on-surface font-bold text-center">Hoàn thành tốt</div>
<div class="font-label-md text-label-md text-brand-blue mt-1">100% xu</div>
</button>
<!-- Option 3: Excellent -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/50 hover:bg-brand-blue/5 transition-colors relative group focus:outline-none">
<div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🎉</div>
<div class="font-label-sm text-label-sm text-on-surface-variant text-center">Xuất sắc!</div>
<div class="font-label-md text-label-md text-brand-blue mt-1">120% xu</div>
</button>
</div>
<!-- Praise/Feedback Section -->
<div class="mb-8">
<div class="flex items-center justify-between mb-3">
<label class="font-label-md text-label-md text-on-surface-variant">Lời nhắn tự động</label>
<button class="text-brand-blue font-label-md text-label-md hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">edit</span>
                        Chỉnh sửa
                    </button>
</div>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-xl p-4 font-body-md text-body-md text-on-surface resize-none focus:ring-0 focus:border-outline-variant cursor-default" readonly="" rows="3">"Cảm ơn con, nhà cửa hôm nay rất gọn gàng!"</textarea>
</div>
<!-- Action Button -->
<button class="w-full bg-brand-blue hover:bg-brand-blue/90 text-white py-4 rounded-xl font-headline-sm text-headline-sm shadow-sm transition-all hover:shadow-md flex items-center justify-center gap-2">
<span>Duyệt &amp; Gửi xu</span>
<span class="text-xl">💰</span>
</button>
</div>
</div>
</body></html>
