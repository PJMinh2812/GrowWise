<style>
        .gradient-bg {
            background: linear-gradient(180deg, #FFF3E0 0%, #ffffff 100%);
        }
        .emoji-scroll::-webkit-scrollbar {
            display: none;
        }
        .emoji-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col font-sans text-on-surface antialiased selection:bg-primary-container selection:text-on-primary">
<main class="flex-grow flex flex-col justify-center items-center px-container-padding py-stack-lg max-w-[600px] mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<div class="text-[80px] mb-stack-md leading-none animate-bounce">
                🏺
            </div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">
                Con muốn dành dụm để mua gì? <span class="text-[#FFB800]">🌟</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Hãy đặt một ước mơ — GrowWise sẽ giúp con đạt được!
            </p>
</div>
<!-- Input Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-container-padding w-full shadow-[0_8px_32px_rgba(255,140,0,0.15)] mb-stack-lg">
<!-- Emoji Picker -->
<div class="mb-stack-md">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-sm">Chọn biểu tượng:</label>
<div class="flex overflow-x-auto emoji-scroll gap-stack-sm pb-2">
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-primary-container rounded-xl border-2 border-primary-container transition-transform active:scale-95">🧸</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">🎮</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">📚</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">🚲</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">👟</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">🎨</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-2xl bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">🎯</button>
<button class="w-12 h-12 flex-shrink-0 flex items-center justify-center text-lg font-bold text-on-surface-variant bg-surface-container rounded-xl border-2 border-transparent hover:border-outline-variant transition-colors">...</button>
</div>
</div>
<!-- Text Input -->
<div class="mb-stack-md">
<label class="sr-only" for="item-name">Tên món đồ mơ ước</label>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-xl px-4 py-4 focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline" id="item-name" placeholder="Tên món đồ mơ ước..." type="text"/>
</div>
<!-- Price Input -->
<div class="mb-stack-md relative">
<label class="sr-only" for="item-price">Giá khoảng</label>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-xl px-4 py-4 pr-12 focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline" id="item-price" placeholder="Giá khoảng..." type="number"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">₫</div>
</div>
<!-- Estimate -->
<div class="bg-surface-bright rounded-lg p-3 flex items-center gap-2 border border-surface-variant">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 1;">timer</span>
<p class="font-body-md text-body-md text-outline italic">
                    ≈ 3 tuần nếu con làm 2 nhiệm vụ/ngày
                </p>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full flex flex-col items-center gap-stack-md">
<button class="w-full bg-primary-container hover:bg-[#E67E00] text-on-primary font-headline-md text-headline-md-mobile rounded-full py-4 shadow-[0_4px_0_0_#CC7000] active:translate-y-[4px] active:shadow-none transition-all duration-150 flex items-center justify-center gap-2">
                Bắt đầu hành trình! <span class="text-xl">🚀</span>
</button>
<button class="font-label-lg text-label-lg text-outline hover:text-on-surface-variant transition-colors underline decoration-outline/50 underline-offset-4">
                Đặt sau
            </button>
</div>
</main>
<script>
        // Simple interaction for emoji picker
        const emojiButtons = document.querySelectorAll('.emoji-scroll button:not(:last-child)');
        emojiButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                emojiButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'border-primary-container');
                    b.classList.add('bg-surface-container', 'border-transparent');
                });
                // Set active
                btn.classList.remove('bg-surface-container', 'border-transparent');
                btn.classList.add('bg-primary-container', 'border-primary-container');
            });
        });
    </script>
</body></html>
