<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowWise · Kết quả</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* nền & chữ */
    --card:#FFFFFF;
    --ink:#222B33;
    --muted:#8A8F98;

    /* TÔNG CẢM XÚC — đổi 4 biến này là đổi sang cảm xúc khác */
    --accent:#3FB955;        /* xanh "hạnh phúc" */
    --accent-deep:#2E9544;
    --accent-soft:#E9F8EC;   /* nền chip / thẻ  */
    --accent-tint:#F3FBF4;   /* quầng sáng nhẹ  */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Fredoka","Nunito",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
  .screen{width:100%;max-width:420px;position:relative;min-height:100vh;background:#FAF6EF;overflow:hidden}

  /* nền app mờ phía sau */
  .behind{position:absolute;inset:0;filter:blur(7px);opacity:.5;pointer-events:none}
  .behind .bar{display:flex;align-items:center;gap:12px;padding:20px}
  .behind .dot{width:44px;height:44px;border-radius:50%;background:#F2913B}
  .behind .pill{height:18px;width:130px;border-radius:9px;background:#d8cdb9}
  .behind .pill.sm{width:80px;margin-left:auto}
  .behind .nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:26px 10px;background:#F1EADF}
  .behind .nav span{width:32px;height:32px;border-radius:50%;background:#dacfbb}
  .behind .nav span:first-child{background:#F2913B}
  .scrim{position:absolute;inset:0;background:rgba(40,38,34,.5);backdrop-filter:blur(2px)}

  /* ---------------- MODAL ---------------- */
  .modal{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(100% - 36px);max-width:362px;
    background:var(--card);border-radius:32px;
    padding:24px 24px 22px;
    box-shadow:0 30px 70px rgba(20,25,30,.34);
    animation:rise .5s cubic-bezier(.2,.8,.25,1) both;
    overflow:hidden;
  }
  /* quầng sáng mềm theo cảm xúc ở đỉnh thẻ */
  .modal::before{content:"";position:absolute;top:-90px;left:50%;transform:translateX(-50%);
    width:280px;height:220px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-tint),transparent 70%);pointer-events:none}

  .head{display:flex;align-items:center;justify-content:center;position:relative}
  .head h1{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.2px}
  .close{position:absolute;right:0;top:-2px;width:34px;height:34px;border-radius:50%;border:none;
    background:#F1F1F3;color:#7C828B;font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s}
  .close:hover{background:#E6E6EA}

  /* mood orb */
  .orb{position:relative;display:flex;justify-content:center;margin:14px 0 4px;height:172px}
  .orb .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.16;
    animation:pulse 3.4s ease-in-out infinite}
  .orb .glow.two{width:128px;height:128px;opacity:.22;animation-delay:.6s}
  .face{position:relative;width:120px;height:120px;border-radius:50%;
    background:var(--accent-soft);border:4px solid var(--accent);
    display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.3,.4,1) .12s both;}
  .face .float{animation:float 3.4s ease-in-out infinite}
  .face svg{width:84px;height:84px;display:block}

  /* confetti */
  .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .confetti i{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;opacity:0;
    animation:drop 1.4s ease-out forwards}

  /* mood label */
  .mood{display:block;width:max-content;margin:6px auto 18px;
    background:var(--accent-soft);color:var(--accent-deep);
    font-size:18px;font-weight:600;padding:9px 24px;border-radius:22px}

  /* tip */
  .tip{background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:20px;
    padding:16px;display:flex;gap:13px}
  .tip .bulb{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center}
  .tip .bulb svg{width:21px;height:21px;color:#fff}
  .tip h3{font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
  .tip p{font-size:14.5px;font-weight:400;color:#5A6068;line-height:1.5}

  /* turns left */
  .turns{display:flex;justify-content:center;align-items:center;gap:6px;
    margin:16px 0 18px;color:var(--muted);font-size:13.5px;font-weight:500}
  .turns svg{width:16px;height:16px;color:var(--accent)}

  /* actions */
  .actions{display:flex;gap:11px}
  .actions button{flex:1;border-radius:18px;padding:15px;font-family:inherit;
    font-size:16.5px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s}
  .btn-ghost{background:#fff;border:1.5px solid #E7E8EB;color:var(--ink)}
  .btn-ghost:hover{background:#FAFAFB}
  .btn-primary{background:var(--accent);border:none;color:#fff;
    box-shadow:0 8px 18px -4px var(--accent)}
  .btn-primary:hover{background:var(--accent-deep)}
  .actions button:active{transform:translateY(2px)}

  @keyframes rise{from{opacity:0;transform:translate(-50%,calc(-50% + 24px)) scale(.96)}
                  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
  @keyframes drop{0%{opacity:0;transform:translateY(0) rotate(0)}
                  15%{opacity:1}
                  100%{opacity:0;transform:translateY(150px) rotate(320deg)}}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>
<div class="screen">

  <div class="behind">
    <div class="bar"><div class="dot"></div><div class="pill"></div><div class="pill sm"></div></div>
    <div class="nav"><span></span><span></span><span></span><span></span></div>
  </div>
  <div class="scrim"></div>

  <div class="modal">
    <div class="head">
      <h1>Kết quả của bạn</h1>
      <button class="close" aria-label="Đóng">✕</button>
    </div>

    <div class="orb">
      <div class="confetti" id="confetti"></div>
      <div class="glow"></div>
      <div class="glow two"></div>
      <div class="face">
        <div class="float">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="face" cx="50%" cy="38%" r="68%">
                <stop offset="0%" stop-color="#FFE27A"/><stop offset="100%" stop-color="#FBBC2E"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="42" fill="url(#face)"/>
            <ellipse cx="50" cy="36" rx="30" ry="20" fill="#fff" opacity=".18"/>
            <ellipse cx="29" cy="59" rx="8" ry="5" fill="#F79BB8" opacity=".75"/>
            <ellipse cx="71" cy="59" rx="8" ry="5" fill="#F79BB8" opacity=".75"/>
            <path d="M27,46 Q35,37 43,46" fill="none" stroke="#3A2A12" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M57,46 Q65,37 73,46" fill="none" stroke="#3A2A12" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M33,60 Q50,80 67,60 Q50,71 33,60 Z" fill="#3A2A12"/>
          </svg>
        </div>
      </div>
    </div>

    <span class="mood">Hạnh phúc</span>

    <div class="tip">
      <div class="bulb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4M12 2a6 6 0 00-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0012 2z"/>
        </svg>
      </div>
      <div>
        <h3>Lời khuyên cho bạn</h3>
        <p>Bạn đang có tâm trạng tuyệt vời! Hãy dành thời gian này để cùng con chơi một trò chơi nhỏ nhé.</p>
      </div>
    </div>

    <div class="turns">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5L16 9"/>
      </svg>
      Còn 2 lượt hôm nay
    </div>

    <div class="actions">
      <button class="btn-ghost">Đo lại</button>
      <button class="btn-primary">Hoàn thành</button>
    </div>
  </div>
</div>

<script>
  const colors=['#3FB955','#FBBC2E','#F2913B','#7C6FE0','#F779A8'];
  const box=document.getElementById('confetti');
  for(let i=0;i<14;i++){
    const c=document.createElement('i');
    c.style.left=(8+Math.random()*84)+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*.5)+'s';
    c.style.width=c.style.height=(6+Math.random()*5)+'px';
    if(i%3===0)c.style.borderRadius='50%';
    box.appendChild(c);
  }
</script>
</body>
</html>
