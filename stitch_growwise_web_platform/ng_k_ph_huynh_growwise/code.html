<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Tạo tài khoản - GrowWise</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-container": "#ff8c00",
                      "inverse-primary": "#ffb77d",
                      "surface-container-high": "#f3e6d4",
                      "on-error": "#ffffff",
                      "tertiary-container": "#b29bff",
                      "tertiary-fixed-dim": "#cdbdff",
                      "on-secondary-fixed-variant": "#005313",
                      "surface-variant": "#eee1cf",
                      "inverse-on-surface": "#fcefdd",
                      "surface-dim": "#e5d8c6",
                      "on-primary-fixed": "#2f1500",
                      "on-background": "#211b10",
                      "on-secondary-container": "#0a7320",
                      "on-tertiary-fixed": "#20005f",
                      "secondary-fixed": "#99f894",
                      "on-surface": "#211b10",
                      "on-primary": "#ffffff",
                      "secondary": "#006e1c",
                      "primary-fixed": "#ffdcc3",
                      "error-container": "#ffdad6",
                      "secondary-container": "#96f592",
                      "on-secondary-fixed": "#002204",
                      "on-error-container": "#93000a",
                      "surface": "#fff8f2",
                      "secondary-fixed-dim": "#7edb7b",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#904d00",
                      "surface-bright": "#fff8f2",
                      "tertiary": "#6833ea",
                      "on-primary-container": "#623200",
                      "tertiary-fixed": "#e8deff",
                      "outline": "#897362",
                      "surface-container": "#f9ecda",
                      "on-tertiary": "#ffffff",
                      "on-surface-variant": "#564334",
                      "on-primary-fixed-variant": "#6e3900",
                      "outline-variant": "#ddc1ae",
                      "inverse-surface": "#362f23",
                      "on-tertiary-container": "#4600bb",
                      "error": "#ba1a1a",
                      "primary": "#904d00",
                      "surface-container-highest": "#eee1cf",
                      "background": "#fff8f2",
                      "primary-fixed-dim": "#ffb77d",
                      "on-tertiary-fixed-variant": "#4f00d0",
                      "surface-container-low": "#fff2e0"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "48px",
                      "gutter": "16px",
                      "base": "4px",
                      "lg": "32px",
                      "sm": "16px",
                      "xs": "8px",
                      "md": "24px",
                      "container-margin": "20px"
              },
              "fontFamily": {
                      "display-lg": [
                              "Nunito Sans"
                      ],
                      "label-bold": [
                              "Nunito Sans"
                      ],
                      "label-sm": [
                              "Nunito Sans"
                      ],
                      "body-md": [
                              "Nunito Sans"
                      ],
                      "headline-md": [
                              "Nunito Sans"
                      ],
                      "body-lg": [
                              "Nunito Sans"
                      ],
                      "display-lg-mobile": [
                              "Nunito Sans"
                      ]
              },
              "fontSize": {
                      "display-lg": [
                              "40px",
                              {
                                      "lineHeight": "48px",
                                      "letterSpacing": "-0.02em",

                      ],
                      "label-bold": [

                      ],
                      "body-md": [

                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "800"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "26px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-lg-mobile": [
                              "32px",
                              {
                                      "lineHeight": "38px",
                                      "fontWeight": "900"
                              }
                      ]
              }
            },
          }
        }
      </script>
<style>
        .input-glow:focus-within {
            border-color: theme('colors.primary-container');
            border-width: 2px;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-margin font-body-md text-on-background">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface rounded-xl shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-surface-container-high relative overflow-hidden">
<!-- Decorative Header -->
<div class="h-32 bg-surface-container flex items-center justify-center relative">
<span class="material-symbols-outlined text-6xl text-primary opacity-20 absolute -right-4 -top-4 transform rotate-12" data-icon="child_care" style="font-variation-settings: 'FILL' 1;">child_care</span>
<span class="material-symbols-outlined text-4xl text-primary-container opacity-30 absolute left-8 bottom-4 transform -rotate-12" data-icon="savings" style="font-variation-settings: 'FILL' 1;">savings</span>
<div class="text-center z-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">GrowWise</h1>
<p class="font-label-bold text-label-bold text-on-surface-variant">Tạo tài khoản Phụ huynh</p>
</div>
</div>
<div class="p-lg">
<form class="space-y-md">
<!-- Full Name Input -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="fullName">Họ tên</label>
<div class="relative input-glow border border-[#564334] rounded-[16px] transition-all duration-200 bg-surface-container-lowest">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="person">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-[48px] pr-sm py-sm font-body-md text-body-md text-on-surface h-[48px] rounded-[16px]" id="fullName" placeholder="Nhập họ và tên" type="text">
</div>
</div>
<!-- Email Input -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="email">Email</label>
<div class="relative input-glow border border-[#564334] rounded-[16px] transition-all duration-200 bg-surface-container-lowest">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-[48px] pr-sm py-sm font-body-md text-body-md text-on-surface h-[48px] rounded-[16px]" id="email" placeholder="Nhập địa chỉ email" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="password">Mật khẩu</label>
<div class="relative input-glow border border-[#564334] rounded-[16px] transition-all duration-200 bg-surface-container-lowest">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-[48px] pr-sm py-sm font-body-md text-body-md text-on-surface h-[48px] rounded-[16px]" id="password" placeholder="Tạo mật khẩu" type="password">
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface" for="confirmPassword">Nhập lại mật khẩu</label>
<div class="relative input-glow border border-[#564334] rounded-[16px] transition-all duration-200 bg-surface-container-lowest">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-transparent border-none focus:ring-0 pl-[48px] pr-sm py-sm font-body-md text-body-md text-on-surface h-[48px] rounded-[16px]" id="confirmPassword" placeholder="Nhập lại mật khẩu" type="password">
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm pt-xs">
<div class="flex items-center h-5">
<input class="w-6 h-6 rounded border-[#564334] text-secondary focus:ring-secondary-container bg-surface-container-lowest transition-colors cursor-pointer" id="terms" type="checkbox">
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                        Tôi đồng ý với <a class="text-primary font-bold hover:underline" href="#">Điều khoản sử dụng</a> và <a class="text-primary font-bold hover:underline" href="#">Chính sách bảo mật</a>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary-container font-label-bold text-label-bold rounded-full border-b-[2px] border-[#904d00] hover:translate-y-[1px] hover:border-b-[1px] active:translate-y-[2px] active:border-b-0 transition-all flex justify-center items-center gap-xs shadow-sm mt-lg" type="button">
                    Đăng ký
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Đã có tài khoản? 
                    <a class="text-primary font-label-bold text-label-bold hover:underline ml-xs" href="#">Đăng nhập</a>
</p>
</div>
</div>
</main>
</body></html>
