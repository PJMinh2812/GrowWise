<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GrowWise - Tạo nhiệm vụ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "on-primary-fixed": "#2f1500",
                        "inverse-primary": "#ffb77d",
                        "tertiary-container": "#b29bff",
                        "tertiary": "#6833ea",
                        "background": "#fff8f2",
                        "on-secondary-container": "#0a7320",
                        "surface-container": "#f9ecda",
                        "secondary-container": "#96f592",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#362f23",
                        "secondary": "#006e1c",
                        "primary-fixed": "#ffdcc3",
                        "surface-container-low": "#fff2e0",
                        "on-tertiary-container": "#4600bb",
                        "surface-dim": "#e5d8c6",
                        "on-primary-fixed-variant": "#6e3900",
                        "tertiary-fixed": "#e8deff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#fff8f2",
                        "on-secondary": "#ffffff",

                        "on-error-container": "#93000a",
                        "surface-container-high": "#f3e6d4",
                        "on-surface": "#211b10",
                        "on-secondary-fixed-variant": "#005313",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#002204",
                        "surface-bright": "#fff8f2",
                        "surface-tint": "#904d00",
                        "on-tertiary-fixed-variant": "#4f00d0",
                        "primary": "#904d00",
                        "outline-variant": "#ddc1ae",
                        "on-primary-container": "#623200",
                        "secondary-fixed-dim": "#7edb7b",
                        "on-tertiary-fixed": "#20005f",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#fcefdd",
                        "surface-container-highest": "#eee1cf"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "sm": "16px",
                        "md": "24px",
                        "container-margin": "20px",
                        "gutter": "16px",
                        "xl": "48px",
                        "lg": "32px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-bold": ["Nunito Sans"],
                        "display-lg-mobile": ["Nunito Sans"],
                        "body-md": ["Nunito Sans"],
                        "body-lg": ["Nunito Sans"],

                    },
                    "fontSize": {

                        "display-lg-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "900" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],

                }
            }
        }

<style>
        .glass-panel {
            background: rgba(249, 236, 218, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-press {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 0 #904d00;
        }
        .btn-press:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 #904d00;
        }
        .input-focus-ring:focus-within {
            border-color: #ff8c00;
            border-width: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-xl antialiased">
<!-- Top App Bar (Parent Mode / Transactional) -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md shadow-[0_4px_12px_rgba(33,27,16,0.05)] w-full flex justify-between items-center px-container-margin py-sm">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary font-bold">Tạo nhiệm vụ</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin py-md max-w-2xl mx-auto space-y-lg">
<!-- Task Form -->
<section class="bg-surface-container rounded-xl p-md shadow-[0_4px_12px_rgba(33,27,16,0.05)] space-y-sm relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-10 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
<!-- Tên nhiệm vụ -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="taskName">Tên nhiệm vụ</label>
<div class="relative input-focus-ring rounded-DEFAULT border border-outline bg-surface-container-lowest transition-all">
<input class="w-full bg-transparent border-none rounded-DEFAULT py-3 px-4 text-on-surface placeholder:text-outline-variant focus:ring-0" id="taskName" placeholder="Vd: Dọn dẹp phòng ngủ" type="text">
</div>
</div>
<!-- Mô tả -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="taskDesc">Mô tả (tùy chọn)</label>
<div class="relative input-focus-ring rounded-DEFAULT border border-outline bg-surface-container-lowest transition-all">
<textarea class="w-full bg-transparent border-none rounded-DEFAULT py-3 px-4 text-on-surface placeholder:text-outline-variant focus:ring-0 resize-none" id="taskDesc" placeholder="Gấp chăn màn gọn gàng..." rows="3"></textarea>
</div>
</div>
<!-- Danh mục -->
<div class="space-y-xs">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="taskCategory">Danh mục</label>
<div class="relative input-focus-ring rounded-DEFAULT border border-outline bg-surface-container-lowest transition-all">
<select class="w-full bg-transparent border-none rounded-DEFAULT py-3 px-4 text-on-surface appearance-none focus:ring-0" id="taskCategory">
<option value="housework">Nhà cửa</option>
<option value="study">Học tập</option>
<option value="health">Sức khỏe</option>
<option value="other">Khác</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Số xu thưởng -->
<div class="space-y-xs pt-2">
<label class="block font-label-bold text-label-bold text-on-surface-variant" for="taskReward">Phần thưởng (Xu)</label>
<div class="flex items-center gap-sm">
<div class="flex-1">
<input class="w-full h-2 bg-surface-variant rounded-full appearance-none cursor-pointer accent-primary-container" id="rewardSlider" max="100" min="5" step="5" type="range" value="20">
</div>
<div class="w-24 relative input-focus-ring rounded-DEFAULT border border-outline bg-surface-container-lowest transition-all flex items-center">
<input class="w-full bg-transparent border-none rounded-DEFAULT py-2 px-3 text-center text-on-surface font-body-lg font-bold focus:ring-0" id="taskReward" max="500" min="1" type="number" value="20">
<span class="absolute right-3 text-primary-container font-bold text-xl">🪙</span>
</div>
</div>
</div>
</section>
<!-- AI Suggestions Bento Box -->
<section class="bg-tertiary-fixed rounded-xl p-md shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-tertiary-fixed-dim relative">
<div class="flex items-center gap-2 mb-sm">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h2 class="font-body-lg text-body-lg text-on-tertiary-fixed font-bold">✨ AI gợi ý nhanh</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<!-- Suggestion 1 -->
<button class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-lg hover:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">book</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">Đọc sách 30 phút</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Học tập</p>
</div>
</div>
<div class="flex items-center gap-1 bg-surface-container py-1 px-2 rounded-full">
<span class="font-label-bold text-label-bold text-primary">15</span>
<span>🪙</span>
</div>
</button>
<!-- Suggestion 2 -->
<button class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-lg hover:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container">cleaning_services</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">Rửa bát bữa tối</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Nhà cửa</p>
</div>
</div>
<div class="flex items-center gap-1 bg-surface-container py-1 px-2 rounded-full">
<span class="font-label-bold text-label-bold text-primary">20</span>
<span>🪙</span>
</div>
</button>
<!-- Suggestion 3 -->
<button class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-lg hover:bg-surface-variant transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary-container">directions_run</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">Tập thể dục</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Sức khỏe</p>
</div>
</div>
<div class="flex items-center gap-1 bg-surface-container py-1 px-2 rounded-full">
<span class="font-label-bold text-label-bold text-primary">25</span>
<span>🪙</span>
</div>
</button>
</div>
</section>
<!-- Action Area -->
<div class="pt-sm flex justify-center">
<button class="w-full md:w-auto min-w-[200px] h-12 bg-primary-container text-on-primary-container font-body-lg text-body-lg font-bold rounded-full btn-press flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Lưu nhiệm vụ
            </button>
</div>
</main>
<script>
        // Sync slider and number input
        const slider = document.getElementById('rewardSlider');
        const input = document.getElementById('taskReward');

        slider.addEventListener('input', function() {
            input.value = this.value;
        });

        input.addEventListener('input', function() {
            if(this.value !== '') {
                slider.value = this.value;
            }
        });

        // AI Suggestion quick fill
        const suggestionButtons = document.querySelectorAll('button.group');
        const taskNameInput = document.getElementById('taskName');
        const taskRewardInput = document.getElementById('taskReward');
        const taskCategorySelect = document.getElementById('taskCategory');

        suggestionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const title = btn.querySelector('p.font-semibold').innerText;
                const categoryText = btn.querySelector('p.font-label-sm').innerText;
                const reward = btn.querySelector('span.text-primary').innerText;

                taskNameInput.value = title;
                taskRewardInput.value = reward;
                slider.value = reward;
                
                // Add a little spring animation to the form to indicate it was filled
                const formSection = document.querySelector('section.bg-surface-container');
                formSection.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    formSection.style.transform = 'scale(1)';
                    formSection.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                }, 150);
            });
        });
    </script>
</body></html>
