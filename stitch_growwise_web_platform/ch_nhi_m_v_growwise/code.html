<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Chợ Nhiệm Vụ - GrowWise</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "spacing": {
                    "xs": "8px",
                    "sm": "16px",
                    "md": "24px",
                    "container-margin": "20px",
                    "gutter": "16px",
                    "xl": "48px",
                    "lg": "32px",
                    "base": "4px"
            },
            "fontFamily": {
                    "label-bold": ["Nunito Sans"],
                    "display-lg-mobile": ["Nunito Sans"],
                    "body-md": ["Nunito Sans"],
                    "body-lg": ["Nunito Sans"],
                    "label-sm": ["Nunito Sans"],
                    "headline-md": ["Nunito Sans"],
                    "display-lg": ["Nunito Sans"]
            },
            "fontSize": {
                    "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "800"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "38px", "fontWeight": "900"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],

          }
        }
      }

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tactile-button {
            border-bottom-width: 3px;
        }
        .tactile-button:active {
            border-bottom-width: 0px;
            transform: translateY(3px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen pb-xl">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 bg-surface shadow-[0_4px_12px_rgba(33,27,16,0.05)] flex justify-between items-center px-container-margin py-sm transition-transform duration-300" id="topAppBar">
<div class="flex items-center gap-sm">
<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-outline-variant bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A 3D stylized avatar of a cheerful young child with messy brown hair, wearing a bright yellow t-shirt. The style is playful modernism with soft, warm studio lighting and vibrant, high-contrast colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZehUauZy_-7Kjyy_G7ItXYUMOjLF62Kfp8RoPdpqCvMu4TwhGSrzJYuk8m97hVbYu3v9HJgw-WOyUsYvmnjI87b9spujn7hWyLdVhKB-xtY9Z6WzkwypYpRgmsBrM6leGjEkwedaHsVcYPkVg-UEpMPckhmlEthpMOQO0ZILETpS5wrAftPYDRtusxyc14CBD39H3i_9y9Dub9_-KxB46kMJGU_w6wSrrGlIfOSYmqG0o73xpcN46ZKj-Bf29WD-ppi_WA7I0QM8">
</div>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">GrowWise</span>
</div>
<div class="flex items-center gap-xs bg-surface-container-high px-4 py-2 rounded-full shadow-sm">
<span class="font-label-bold text-label-bold text-on-surface">150</span>
<span class="text-xl leading-none">🪙</span>
</div>
</header>
<!-- Main Canvas -->
<main class="pt-[88px] pb-[100px] px-container-margin">
<!-- Header Section -->
<section class="py-md flex items-center justify-between">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface leading-tight">Cửa hàng<br>nhiệm vụ</h1>
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center animate-[spin_10s_linear_infinite]">
<span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1;">star</span>
</div>
</section>
<!-- Filter Chips Container -->
<section class="flex gap-xs overflow-x-auto pb-sm no-scrollbar">
<button class="flex-shrink-0 bg-primary text-on-primary font-label-bold text-label-bold px-5 py-3 rounded-full tactile-button border-surface-tint shadow-sm transition-all">
                Tất cả
            </button>
<button class="flex-shrink-0 bg-surface-container text-on-surface font-label-bold text-label-bold px-5 py-3 rounded-full tactile-button border-outline-variant shadow-sm hover:bg-surface-container-high transition-all">
                🧹 Việc nhà
            </button>
<button class="flex-shrink-0 bg-surface-container text-on-surface font-label-bold text-label-bold px-5 py-3 rounded-full tactile-button border-outline-variant shadow-sm hover:bg-surface-container-high transition-all">
                📚 Học tập
            </button>
<button class="flex-shrink-0 bg-surface-container text-on-surface font-label-bold text-label-bold px-5 py-3 rounded-full tactile-button border-outline-variant shadow-sm hover:bg-surface-container-high transition-all">
                🍎 Sức khỏe
            </button>
</section>
<!-- Quest Cards Grid (Bento Style) -->
<section class="grid grid-cols-2 gap-sm mt-sm">
<!-- Card 1 -->
<article class="bg-surface-container-lowest rounded-DEFAULT p-sm flex flex-col justify-between shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-outline-variant relative overflow-hidden min-h-[160px] group">
<div class="absolute -top-6 -right-6 w-20 h-20 bg-secondary-fixed rounded-full opacity-40 group-hover:scale-110 transition-transform duration-500"></div>
<div class="text-[40px] mb-xs z-10 leading-none">🛏️</div>
<h3 class="font-body-lg text-body-lg text-on-surface z-10 leading-tight mb-md">Gấp chăn màn</h3>
<div class="flex items-center justify-between mt-auto z-10">
<span class="font-label-bold text-label-bold text-secondary">+15 xu</span>
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full tactile-button border-[#c46b00] shadow-sm">Nhận</button>
</div>
</article>
<!-- Card 2 -->
<article class="bg-surface-container-lowest rounded-DEFAULT p-sm flex flex-col justify-between shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-outline-variant relative overflow-hidden min-h-[160px] group">
<div class="absolute -bottom-4 -left-4 w-16 h-16 bg-tertiary-fixed rounded-full opacity-60 group-hover:scale-125 transition-transform duration-500"></div>
<div class="text-[40px] mb-xs z-10 leading-none">📖</div>
<h3 class="font-body-lg text-body-lg text-on-surface z-10 leading-tight mb-md">Đọc 10 trang sách</h3>
<div class="flex items-center justify-between mt-auto z-10">
<span class="font-label-bold text-label-bold text-secondary">+30 xu</span>
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full tactile-button border-[#c46b00] shadow-sm">Nhận</button>
</div>
</article>
<!-- Card 3 (Full width feature) -->
<article class="bg-surface-container-lowest rounded-DEFAULT p-sm flex flex-col justify-between shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-outline-variant relative overflow-hidden col-span-2 group min-h-[140px]">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed rounded-bl-full opacity-30 group-hover:bg-primary-fixed-dim transition-colors duration-500"></div>
<div class="flex items-start gap-sm z-10">
<div class="text-[48px] leading-none">🏃</div>
<div>
<h3 class="font-headline-md text-headline-md-mobile text-on-surface leading-tight mb-1">Tập thể dục</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant">15 phút mỗi ngày</p>
</div>
</div>
<div class="flex items-center justify-between mt-md z-10">
<div class="flex items-center gap-1 bg-surface-container px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-bold text-label-bold text-secondary">+20 xu</span>
</div>
<button class="bg-primary-container text-on-primary-container font-label-bold text-label-bold px-6 py-3 rounded-full tactile-button border-[#c46b00] shadow-sm flex items-center gap-2">
                        Nhận <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</article>
<!-- Card 4 -->
<article class="bg-surface-container-lowest rounded-DEFAULT p-sm flex flex-col justify-between shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-outline-variant relative overflow-hidden min-h-[160px] group">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-surface-container rounded-full opacity-50 scale-0 group-hover:scale-100 transition-transform duration-300"></div>
<div class="text-[40px] mb-xs z-10 leading-none text-center">🦷</div>
<h3 class="font-body-lg text-body-lg text-on-surface z-10 leading-tight mb-md text-center">Đánh răng tối</h3>
<div class="flex items-center justify-between mt-auto z-10">
<span class="font-label-bold text-label-bold text-secondary">+10 xu</span>
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full tactile-button border-[#c46b00] shadow-sm">Nhận</button>
</div>
</article>
<!-- Card 5 -->
<article class="bg-surface-container-lowest rounded-DEFAULT p-sm flex flex-col justify-between shadow-[0_4px_12px_rgba(33,27,16,0.05)] border border-outline-variant relative overflow-hidden min-h-[160px] group">
<div class="absolute -top-4 -left-4 w-16 h-16 bg-error-container rounded-full opacity-60"></div>
<div class="text-[40px] mb-xs z-10 leading-none">🧸</div>
<h3 class="font-body-lg text-body-lg text-on-surface z-10 leading-tight mb-md">Dọn đồ chơi</h3>
<div class="flex items-center justify-between mt-auto z-10">
<span class="font-label-bold text-label-bold text-secondary">+25 xu</span>
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-4 py-2 rounded-full tactile-button border-[#c46b00] shadow-sm">Nhận</button>
</div>
</article>
</section>
</main>
<!-- Shared Component: BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-xs pt-xs bg-surface dark:bg-surface-dim shadow-[0_-4px_12px_rgba(33,27,16,0.05)] rounded-t-lg md:hidden">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors w-16">
<span class="material-symbols-outlined mb-1 text-[24px]">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<!-- Learn -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors w-16">
<span class="material-symbols-outlined mb-1 text-[24px]">school</span>
<span class="font-label-sm text-label-sm">Learn</span>
</button>
<!-- Save -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors w-16">
<span class="material-symbols-outlined mb-1 text-[24px]">savings</span>
<span class="font-label-sm text-label-sm">Save</span>
</button>
<!-- Quests (ACTIVE STATE) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 animate-bounce Active:scale-95 transition-transform duration-150 w-20">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
<span class="font-label-sm text-label-sm font-bold">Quests</span>
</button>
<!-- Shop -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors w-16">
<span class="material-symbols-outlined mb-1 text-[24px]">storefront</span>
<span class="font-label-sm text-label-sm">Shop</span>
</button>
</nav>
</body></html>
