<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #fff8f3;
            overflow-x: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .btn-3d-primary {
            transform: translateY(0);
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 0 #6e3900;
        }
        .btn-3d-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #6e3900;
        }

        .btn-3d-secondary {
            transform: translateY(0);
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 0 #ddc1ae;
        }
        .btn-3d-secondary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #ddc1ae;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff8c00;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .bounce-gentle {
            animation: bounce-gentle 2s infinite ease-in-out;
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .star-pulse {
            animation: star-pulse 1.5s infinite ease-in-out;
        }

        @keyframes star-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Hero Image Layout */
        .hero-container {
            perspective: 1000px;
        }
    </style>

<script>
        // Confetti Generator
        function createConfetti() {
            const container = document.getElementById('confetti-wrapper');
            const colors = ['#ff8c00', '#006e1c', '#6833ea', '#ffdcc3', '#96f592'];
            
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Random styles
                const size = Math.random() * 8 + 6 + 'px';
                confetti.style.width = size;
                confetti.style.height = size;
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                confetti.style.opacity = Math.random();
                
                container.appendChild(confetti);
                
                // Remove element after animation
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Initialize confetti on load
        window.addEventListener('load', () => {
            createConfetti();
            
            // Show toast briefly
            setTimeout(() => {
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 3000);
            }, 1000);
        });

        // Loop confetti every 5 seconds
        setInterval(createConfetti, 5000);
    </script>
