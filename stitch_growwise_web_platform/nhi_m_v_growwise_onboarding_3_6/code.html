<style>
        body { font-family: 'Nunito Sans', sans-serif; }
        /* Tactile Button Style */
        .btn-tactile {
            border-bottom: 2px solid #904d00;
            transition: all 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(2px);
            border-bottom-width: 0px;
            margin-bottom: 2px;
        }
        /* Soft Skeuomorphic Shadow */
        .shadow-soft {
            box-shadow: 0 4px 12px rgba(144, 77, 0, 0.05);
        }
        /* Child Mode Glow */
        .glow-child {
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.1);
        }
        /* Spring Animation for Coins */
        @keyframes pop {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            50% { transform: scale(1.1) translateY(-10px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
