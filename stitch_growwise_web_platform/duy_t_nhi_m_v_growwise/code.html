<style>
        .glassmorphism {
            background: rgba(255, 248, 242, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .soft-shadow {
            box-shadow: 0 4px 12px rgba(33, 27, 16, 0.05);
        }
        
        .tactile-btn {
            border-bottom: 2px solid;
            transition: all 0.1s ease-in-out;
        }
        
        .tactile-btn:active {
            transform: translateY(2px);
            border-bottom-width: 0px;
            margin-top: 2px;
        }
        
        .star-rating .star {
            color: #eee1cf; /* surface-variant */
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .star-rating .star.active {
            color: #ff8c00; /* primary-container */
        }
        
        /* Custom scrollbar for reasoning input */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: #fff2e0; /* surface-container-low */
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #ddc1ae; /* outline-variant */
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased h-screen flex flex-col relative overflow-hidden">
<!-- Top App Bar (Task-Focused - Close action implies temporary departure, so Nav Shell is suppressed normally, but we use TopAppBar as header) -->
<header class="bg-surface docked full-width top-0 shadow-[0_4px_12px_rgba(33,27,16,0.05)] z-10 flex justify-between items-center px-container-margin py-sm w-full">
<!-- Leading Action: Close -->
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-2xl">close</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md-mobile text-primary font-extrabold text-center flex-1 tracking-tight">Duyệt Nhiệm Vụ</h1>
<!-- Trailing Action: Spacer for balance -->
<div class="w-10 h-10"></div>
</header>
<!-- Main Content Canvas (Scrollable) -->
<main class="flex-1 overflow-y-auto px-container-margin py-md space-y-md pb-[120px]">
<!-- Task Info Card -->
<div class="glassmorphism rounded-xl p-md soft-shadow flex flex-col gap-sm">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md-mobile text-on-background">Dọn dẹp phòng ngủ</h2>
<p class="font-body-md text-on-surface-variant mt-1">Gửi bởi: Bé Bi</p>
</div>
<div class="bg-surface-container-high rounded-full px-4 py-2 flex items-center gap-2 border border-outline-variant">
<span class="font-label-bold text-label-bold text-primary">+50</span>
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
</div>
</div>
</div>
<!-- Evidence Image -->
<div class="rounded-xl overflow-hidden soft-shadow relative aspect-square w-full bg-surface-container-high">
<img alt="Ảnh minh chứng nhiệm vụ" class="object-cover w-full h-full" data-alt="A brightly lit, slightly messy but organized child's bedroom in daylight. A neatly made bed with colorful bedding is the focus. Sunlight streams through a window, casting warm, natural light. The aesthetic is clean, modern, and cheerful, consistent with a playful, family-friendly app environment. High contrast, warm tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5LcuJCuHHfTjqE0WfUb4sm1gdwN4k_t5H93Ydjf3-3f6MmizqQZT7_r8gRD9M5RXN0XaPrDthIXBgUVMidOsDECNlRjo9aRyocO6uyVCOmGqzWpWGUvMZwZbeDbvn_3w1-ZaHIS6cd60zS_l-sexrxNwchn8-71s8FmIiqCn1EB0bEXgHnD_tm0_LethrOCOUChDVXZPRm8Jx5Nst9CVBIil5sag7m1xW88U90PtlarO-vBBCoUl4bU-lnLZSFepR-m9hkEvpc24">
<!-- Floating timestamp -->
<div class="absolute bottom-4 right-4 bg-surface/80 backdrop-blur-sm px-3 py-1 rounded-full text-label-sm font-label-sm text-on-surface-variant flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[14px]">schedule</span>
                10 phút trước
            </div>
</div>
<!-- Quality Rating -->
<div class="bg-surface-container rounded-xl p-md soft-shadow">
<h3 class="font-body-lg text-body-lg text-on-background mb-3 text-center">Đánh giá chất lượng</h3>
<div class="flex justify-center gap-2 star-rating text-4xl">
<span class="material-symbols-outlined star active" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star active" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star active" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star active" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-2">Rất tốt (4/5)</p>
</div>
<!-- Rejection Reason Input (Hidden by default, shown conditionally if rejected) -->
<div class="bg-surface-container-low rounded-xl p-sm border border-outline-variant focus-within:border-primary-container focus-within:border-2 transition-all">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="reject-reason">Lý do từ chối (nếu có)</label>
<textarea class="w-full bg-transparent border-none outline-none resize-none font-body-md text-on-background placeholder:text-surface-variant" id="reject-reason" placeholder="Ví dụ: Bé quét góc tường chưa sạch nhé..." rows="2"></textarea>
</div>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-container shadow-[0_-8px_24px_rgba(33,27,16,0.08)] p-container-margin z-20">
<div class="flex gap-4">
<!-- Reject Button -->
<button class="flex-1 bg-error-container text-on-error-container rounded-full h-xl font-body-lg text-body-lg tactile-btn border-error/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">thumb_down</span>
                Từ chối
            </button>
<!-- Approve Button -->
<button class="flex-[2] bg-secondary text-on-secondary rounded-full h-xl font-body-lg text-body-lg tactile-btn border-on-secondary-fixed-variant flex items-center justify-center gap-2 shadow-lg">
<span class="material-symbols-outlined">check_circle</span>
                Duyệt
            </button>
</div>
</div>
<!-- Inline script for star rating interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star');
            const ratingText = document.querySelector('.star-rating + p');
            
            const ratingLabels = [
                "Cần cố gắng (1/5)",
                "Tạm được (2/5)",
                "Khá tốt (3/5)",
                "Rất tốt (4/5)",
                "Tuyệt vời! (5/5)"
            ];

            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    // Update active state
                    stars.forEach((s, i) => {
                        if (i <= index) {
                            s.classList.add('active');
                            s.style.fontVariationSettings = "'FILL' 1";
                        } else {
                            s.classList.remove('active');
                            s.style.fontVariationSettings = "'FILL' 0";
                        }
                    });
                    
                    // Update text
                    ratingText.textContent = ratingLabels[index];
                    
                    // Small spring animation effect
                    star.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        star.style.transform = 'scale(1)';
                    }, 150);
                });
            });
        });
    </script>
</body></html>
