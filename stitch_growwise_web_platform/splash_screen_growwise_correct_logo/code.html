<style>
        .loading-dots div {
            animation: bounce 1.2s infinite ease-in-out both;
        }
        .loading-dots div:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots div:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .bg-cream-gradient {
            background: linear-gradient(135deg, #fff8f2 0%, #f9ecda 100%);
        }
        
        /* Mascot Spring Animation */
        @keyframes mascot-spring {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            50% { transform: scale(1.05) translateY(-10px); opacity: 1; }
            70% { transform: scale(0.98) translateY(5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-mascot {
            animation: mascot-spring 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Text Fade In */
        @keyframes fade-up {
            0% { transform: translateY(15px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-up {
            animation: fade-up 0.8s ease-out 0.4s forwards;
            opacity: 0;
        }
        .animate-fade-up-delay {
            animation: fade-up 0.8s ease-out 0.6s forwards;
            opacity: 0;
        }
    </style>
