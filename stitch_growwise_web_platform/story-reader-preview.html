<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đọc truyện · GrowWise</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GrowWise · Playful Modernism — refined design system
   ============================================================ */
:root{
  /* surfaces */
  --surface:#FFF8F2; --surface-low:#FFF2E0; --surface-c:#F9ECDA;
  --surface-high:#F3E6D4; --white:#FFFFFF;
  /* text */
  --ink:#211B10; --ink-soft:#564334; --outline:#897362; --outline-v:#DDC1AE;
  /* brand */
  --primary:#904D00; --primary-c:#FF8C00; --primary-fixed:#FFDCC3; --on-primary-c:#623200;
  --secondary:#006E1C; --secondary-c:#96F592; --secondary-dim:#7EDB7B; --on-secondary-c:#0A7320;
  --tertiary:#6833EA; --tertiary-c:#B29BFF; --tertiary-fixed:#E8DEFF; --on-tertiary-c:#4600BB;
  --error:#BA1A1A; --error-c:#FFDAD6;
  /* radii */
  --r-input:16px; --r-card:24px; --r-pill:999px;
  /* depth */
  --soft:0 8px 22px -12px rgba(120,70,20,.30);
  --soft-lg:0 16px 36px -16px rgba(120,70,20,.34);
  --glow:0 12px 26px -12px rgba(255,140,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-family:"Nunito Sans","Segoe UI",system-ui,sans-serif}
body{background:var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'opsz' 24}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

/* phone shell (for standalone view) */
.screen{max-width:430px;margin:0 auto;min-height:100vh;background:var(--surface);
  display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:0 20px 110px}

/* app bar */
.gw-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 20px;background:rgba(255,248,242,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--outline-v)}
.gw-top .brand{display:flex;align-items:center;gap:10px}
.gw-top .brand b{font-size:21px;font-weight:900;color:var(--primary);letter-spacing:.2px}
.gw-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;
  background:var(--primary-fixed);border:2px solid var(--primary-c);overflow:hidden}
.gw-coin{display:inline-flex;align-items:center;gap:6px;background:var(--white);
  border:1px solid var(--outline-v);border-bottom-width:3px;border-radius:var(--r-pill);
  padding:7px 14px;font-weight:800;color:var(--primary);font-size:15px;cursor:pointer;transition:.12s}
.gw-coin:active{transform:translateY(2px);border-bottom-width:1px}
.gw-coin .material-symbols-outlined{font-size:19px;color:var(--primary-c)}

/* buttons — tactile pills */
.gw-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:52px;padding:0 22px;border:none;border-radius:var(--r-pill);font-family:inherit;
  font-size:16px;font-weight:800;letter-spacing:.02em;cursor:pointer;transition:transform .1s,box-shadow .1s,background .15s}
.gw-btn--primary{background:var(--primary-c);color:var(--on-primary-c);border-bottom:4px solid var(--primary)}
.gw-btn--primary:hover{filter:brightness(1.02)}
.gw-btn--secondary{background:var(--secondary-c);color:var(--on-secondary-c);border-bottom:4px solid var(--secondary)}
.gw-btn--tertiary{background:var(--tertiary);color:#fff;border-bottom:4px solid #4600BB}
.gw-btn--ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--outline-v);border-bottom-width:3px}
.gw-btn:active{transform:translateY(3px);border-bottom-width:1px!important}
.gw-btn--sm{height:42px;font-size:14px;width:auto;padding:0 18px}

/* inputs */
.gw-field{position:relative}
.gw-field .material-symbols-outlined{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--ink-soft);font-size:22px;transition:color .15s;pointer-events:none}
.gw-input{width:100%;height:54px;padding:0 16px 0 46px;background:var(--white);
  border:1.5px solid var(--outline-v);border-radius:var(--r-input);font-family:inherit;font-size:16px;
  font-weight:600;color:var(--ink);transition:border .15s,box-shadow .15s}
.gw-input::placeholder{color:#b6a48c;font-weight:600}
.gw-input:focus{outline:none;border:2px solid var(--primary-c);box-shadow:0 0 0 4px rgba(255,140,0,.14)}
.gw-field:focus-within .material-symbols-outlined{color:var(--primary-c)}
.gw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--ink-soft);cursor:pointer;padding:6px;display:grid;place-items:center}

/* cards */
.gw-card{background:var(--white);border:1.5px solid #F0E6D8;border-radius:var(--r-card);
  box-shadow:var(--soft);padding:18px}
.gw-card--glow{box-shadow:var(--glow)}
.gw-card--press{transition:transform .12s,box-shadow .12s;cursor:pointer}
.gw-card--press:hover{transform:translateY(-3px)}
.gw-card--press:active{transform:translateY(0)}

/* chips */
.gw-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-pill);
  font-size:12px;font-weight:800}
.chip-video{background:var(--secondary-c);color:var(--on-secondary-c)}
.chip-story{background:var(--tertiary-fixed);color:var(--on-tertiary-c)}
.chip-game{background:var(--surface-high);color:var(--ink-soft)}
.chip-new{background:var(--primary-fixed);color:var(--on-primary-c)}

/* progress — candy stripe */
.gw-progress{height:16px;border-radius:var(--r-pill);background:rgba(0,0,0,.07);overflow:hidden}
.gw-progress>i{display:block;height:100%;border-radius:var(--r-pill);position:relative;
  background:linear-gradient(90deg,var(--secondary-dim),var(--secondary))}
.gw-progress>i::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background-image:linear-gradient(45deg,rgba(255,255,255,.30) 25%,transparent 25%,transparent 50%,
    rgba(255,255,255,.30) 50%,rgba(255,255,255,.30) 75%,transparent 75%);
  background-size:18px 18px;animation:stripe 1s linear infinite}
.gw-progress.orange>i{background:linear-gradient(90deg,#FBA53A,var(--primary-c))}

/* filter tabs */
.gw-tabs{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}
.gw-tab{flex:none;padding:9px 16px;border-radius:var(--r-pill);font-size:14px;font-weight:800;cursor:pointer;
  background:var(--surface-high);color:var(--ink-soft);border:none;border-bottom:3px solid var(--outline-v);transition:.12s}
.gw-tab.active{background:var(--primary);color:#fff;border-bottom-color:#5e3300}
.gw-tab:active{transform:translateY(2px);border-bottom-width:1px}

/* content tile (library) */
.gw-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gw-tile{display:flex;flex-direction:column;background:var(--white);border:1.5px solid #F0E6D8;
  border-bottom:4px solid var(--outline-v);border-radius:20px;padding:10px;cursor:pointer;
  transition:transform .14s,box-shadow .14s;box-shadow:var(--soft)}
.gw-tile:hover{transform:translateY(-4px)}
.gw-tile .thumb{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:54px;
  margin-bottom:10px;overflow:hidden;position:relative}
.gw-tile h3{font-size:15px;font-weight:800;line-height:1.2;margin-top:6px;color:var(--ink)}
.gw-tile .lock{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--primary);box-shadow:var(--soft)}

/* section title */
.gw-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.gw-h h2{font-size:21px;font-weight:900;color:var(--ink)}
.gw-h a{font-size:14px;font-weight:800;color:var(--primary);cursor:pointer}

/* floating bottom nav */
.gw-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:40;
  display:flex;justify-content:space-around;align-items:flex-end;
  background:rgba(255,248,242,.92);backdrop-filter:blur(12px);border-top:1px solid var(--outline-v);
  padding:8px 8px 14px}
.gw-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;
  color:var(--outline);font-size:11px;font-weight:800;cursor:pointer}
.gw-nav a .material-symbols-outlined{font-size:25px;font-variation-settings:'FILL' 0}
.gw-nav a.active{color:var(--primary)}
.gw-nav a.active .material-symbols-outlined{font-variation-settings:'FILL' 1}
.gw-nav a.active .bubble{width:54px;height:54px;border-radius:50%;background:var(--primary-c);color:#fff;
  display:grid;place-items:center;margin-top:-24px;border:4px solid var(--surface);
  box-shadow:var(--glow);animation:bouncein .5s cubic-bezier(.2,1.4,.4,1)}
.gw-nav a.active .bubble .material-symbols-outlined{font-size:28px;font-variation-settings:'FILL' 1}

/* mascot bubble */
.gw-bubble{position:relative;display:inline-block;background:#fff;border:1.5px solid var(--outline-v);
  border-radius:16px;padding:10px 18px;font-weight:800;color:var(--primary);box-shadow:var(--soft);
  animation:bob 2.6s ease-in-out infinite}
.gw-bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:#fff;
  border-right:1.5px solid var(--outline-v);border-bottom:1.5px solid var(--outline-v);
  transform:translateX(-50%) rotate(45deg)}

/* animations */
@keyframes stripe{to{background-position:18px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bouncein{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.25,1) both}
.rise-2{animation-delay:.07s}.rise-3{animation-delay:.14s}.rise-4{animation-delay:.21s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== story components ===== */
.gw-switch{display:flex;gap:4px;background:var(--surface-high);border:1.5px solid var(--outline-v);
  border-radius:var(--r-pill);padding:5px;max-width:360px;margin:0 auto}
.gw-switch button{flex:1;border:none;background:none;padding:10px;border-radius:var(--r-pill);
  font-family:inherit;font-weight:800;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:.15s}
.gw-switch button.active{background:var(--primary);color:#fff;box-shadow:var(--soft)}

.gw-story{display:flex;flex-direction:column;background:var(--white);border:1.5px solid #F0E6D8;
  border-bottom:5px solid var(--outline-v);border-radius:22px;padding:10px;cursor:pointer;
  box-shadow:var(--soft);transition:transform .14s}
.gw-story:hover{transform:translateY(-4px)}
.gw-story .cover{aspect-ratio:3/4;border-radius:14px;display:grid;place-items:center;font-size:58px;
  overflow:hidden;position:relative;margin-bottom:10px}
.gw-story h3{font-size:16px;font-weight:900;line-height:1.15;color:var(--ink)}
.gw-story p{font-size:13px;color:var(--ink-soft);font-weight:600;margin:4px 0 10px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gw-story .lock{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--primary);box-shadow:var(--soft)}

/* immersive reader */
.reader{max-width:560px;margin:0 auto;min-height:100vh;background:var(--surface);padding:18px 22px 34px;position:relative}
.reader .close{position:absolute;top:16px;right:18px;width:46px;height:46px;border-radius:50%;
  background:var(--surface-c);border:1.5px solid var(--outline-v);border-bottom-width:4px;color:var(--ink-soft);
  display:grid;place-items:center;cursor:pointer}
.reader .close:active{transform:translateY(2px);border-bottom-width:1px}
.reader .art{aspect-ratio:4/3;border-radius:24px;border:2px solid var(--outline-v);border-bottom-width:6px;
  overflow:hidden;display:grid;place-items:center;font-size:96px;margin:40px 0 18px;box-shadow:var(--soft)}
.reader h1{font-size:26px;font-weight:900;color:var(--primary);line-height:1.15;margin-bottom:14px}
.reader article p{font-size:18px;line-height:1.7;color:var(--ink-soft);font-weight:600;margin-bottom:16px}
.reader .pager{margin-top:26px}
.reader .dots{display:flex;gap:7px;justify-content:flex-end;margin-bottom:14px;align-items:center}
.reader .dots small{margin-right:auto;font-weight:800;color:var(--ink-soft);font-size:13px}
.reader .dots i{width:9px;height:9px;border-radius:50%;background:var(--outline-v);display:block}
.reader .dots i.on{background:var(--primary);width:22px;border-radius:99px}
.reader .row{display:flex;gap:14px}

</style>
<style>
  body{background:#241B12}
  .mreader{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:radial-gradient(120% 70% at 50% 30%,#3A2E22,#1E160E)}
  .m-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;
    color:#fff;background:linear-gradient(#1E160E,rgba(30,22,14,0))}
  .m-top .ico{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);border:none;
    color:#fff;display:grid;place-items:center;cursor:pointer}
  .m-top .ico:active{transform:scale(.94)}
  .m-title{flex:1;text-align:center;line-height:1.1}
  .m-title b{font-size:16px;font-weight:900;display:block}
  .m-title small{font-size:12px;font-weight:700;color:var(--primary-c)}
  .m-count{font-size:13px;font-weight:800;color:#E8D8C4;min-width:54px;text-align:right}

  .m-stage{flex:1;display:grid;place-items:center;padding:8px 16px 16px;position:relative}
  .zone{position:absolute;top:0;bottom:0;width:38%;z-index:4;cursor:pointer}
  .zone.l{left:0}.zone.r{right:0}

  .m-page{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:8px;
    display:flex;flex-direction:column;gap:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
    animation:flip .32s ease both}
  @keyframes flip{from{opacity:0;transform:translateX(14px) scale(.99)}to{opacity:1;transform:none}}
  .panel{position:relative;border-radius:9px;overflow:hidden;display:grid;place-items:center;
    min-height:150px;border:2px solid #241B12}
  .panel .big{font-size:74px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
  .bubble{position:absolute;top:12px;left:12px;max-width:74%;background:#fff;border:2px solid #241B12;
    border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;color:#241B12;line-height:1.25}
  .bubble::after{content:"";position:absolute;left:22px;bottom:-10px;width:14px;height:14px;background:#fff;
    border-right:2px solid #241B12;border-bottom:2px solid #241B12;transform:rotate(45deg)}
  .bubble.r{left:auto;right:12px}.bubble.r::after{left:auto;right:22px}
  .cap{position:absolute;left:10px;bottom:10px;background:#FFF3D6;border:2px solid #241B12;border-radius:8px;
    padding:6px 10px;font-size:12.5px;font-weight:800;color:#5A3410;max-width:80%}

  .m-foot{position:sticky;bottom:0;z-index:5;padding:12px 16px 18px;
    background:linear-gradient(rgba(30,22,14,0),#1E160E)}
  .m-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .m-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28)}
  .m-dots i.on{background:var(--primary-c);width:20px;border-radius:99px}
  .m-row{display:flex;gap:12px}
</style></head>
<body>
<div class="mreader">
  <header class="m-top">
    <button class="ico" aria-label="Đóng"><span class="material-symbols-outlined">close</span></button>
    <div class="m-title"><b>Sự tích Heo đất</b><small>CHƯƠNG 2 · Bạn Heo đất tham ăn</small></div>
    <span class="m-count" id="count">1 / 5</span>
  </header>

  <div class="m-stage">
    <div class="zone l" onclick="prev()"></div>
    <div class="zone r" onclick="next()"></div>
    <div id="page"></div>
  </div>

  <footer class="m-foot">
    <div class="m-dots" id="dots"></div>
    <div class="m-row">
      <button class="gw-btn gw-btn--ghost" id="btnPrev" onclick="prev()">‹ Trước</button>
      <button class="gw-btn gw-btn--primary" id="btnNext" onclick="next()">Sau ›</button>
    </div>
  </footer>
</div>

<script>
// mỗi PAGE là một trang tranh, gồm 1–2 khung (panel)
const pages = [
  [{bg:"linear-gradient(150deg,#FFE0B8,#FFC07A)", big:"🐷", bubble:"Tớ là Ụt Ịt, bạn Heo đất của Bi!"},
   {bg:"linear-gradient(150deg,#FFD0E0,#FFB0C4)", big:"🐷", bubble:"Đói quá... có đồng xu nào cho tớ ăn không?", r:true}],
  [{bg:"linear-gradient(150deg,#CFE8FF,#A9D4FF)", big:"🧒", bubble:"Để Bi cho Ụt Ịt ăn nhé!"},
   {bg:"linear-gradient(150deg,#FFEFC2,#FFD98A)", big:"🪙", cap:"Mỗi ngày, Bi để dành một ít tiền tiêu vặt."}],
  [{bg:"linear-gradient(150deg,#FFD9B8,#FFB781)", big:"🐷", bubble:"Ăn nữa! Ăn nữa đi Bi ơi!"},
   {bg:"linear-gradient(150deg,#FAD7B0,#F0B27A)", big:"🐽", cap:"Ụt Ịt ăn mãi mà bụng vẫn cứ kêu réo..."}],
  [{bg:"linear-gradient(150deg,#E3D6FB,#C3AEF5)", big:"🤔", cap:"Bi bắt đầu suy nghĩ về Ụt Ịt tham ăn."},
   {bg:"linear-gradient(150deg,#FFE0B8,#FFC07A)", big:"🐷", bubble:"Tớ vẫn thấy trống rỗng...", r:true}],
  [{bg:"linear-gradient(150deg,#CFEFCF,#9AE59A)", big:"💡", cap:"Tiết kiệm là để DÀNH, không phải ăn hết ngay!"},
   {bg:"linear-gradient(150deg,#FFF0C2,#FFE08A)", big:"🐷", bubble:"Tớ hiểu rồi! Cảm ơn Bi nhé! ✨"}],
];
let cur = 0;
const pageEl=document.getElementById('page'), countEl=document.getElementById('count'),
      dotsEl=document.getElementById('dots'), bP=document.getElementById('btnPrev'), bN=document.getElementById('btnNext');

function render(){
  pageEl.innerHTML = `<div class="m-page">${pages[cur].map(p=>`
    <div class="panel" style="background:${p.bg}">
      <span class="big">${p.big}</span>
      ${p.bubble?`<div class="bubble ${p.r?'r':''}">${p.bubble}</div>`:``}
      ${p.cap?`<div class="cap">${p.cap}</div>`:``}
    </div>`).join('')}</div>`;
  countEl.textContent = `${cur+1} / ${pages.length}`;
  dotsEl.innerHTML = pages.map((_,i)=>`<i class="${i===cur?'on':''}"></i>`).join('');
  bP.style.visibility = cur===0 ? 'hidden':'visible';
  bN.textContent = cur===pages.length-1 ? 'Chương 3 ›' : 'Sau ›';
}
function next(){ if(cur<pages.length-1){cur++;render();} else { bN.textContent='Hết chương 🎉'; } }
function prev(){ if(cur>0){cur--;render();} }
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
render();
</script>
</body></html>
