<body class="bg-background min-h-screen text-on-background flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Area: Logo & Language Switcher -->
<header class="w-full flex justify-between items-center px-container-margin py-md relative z-10">
<div class="flex items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined icon-fill text-[20px]">psychology</span>
</div>
<span class="font-label-bold text-label-bold text-primary">GrowWise</span>
</div>
<div class="flex items-center gap-2 bg-surface-container rounded-full px-3 py-1 border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">language</span>
<div class="flex items-center font-label-bold text-label-bold text-sm">
<button class="text-primary pr-1 border-r border-outline-variant">VI</button>
<button class="text-on-surface-variant pl-1 hover:text-primary transition-colors">EN</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto px-container-margin flex flex-col justify-center pb-xl relative z-0">
<!-- Mascot Illustration Area -->
<div class="w-full flex justify-center mb-md">
<div class="w-40 h-40 bg-contain bg-center bg-no-repeat drop-shadow-xl animate-[bounce_3s_ease-in-out_infinite]" data-alt="A 3D rendered illustration of Wisy, a friendly and cute little owl mascot, waving its wing happily. The owl has a playful, appealing design suitable for children, with large expressive eyes. It is set against a clean, warm cream background, matching a light-mode mobile app aesthetic, glowing with a soft, inviting light." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQOJergUpKZrGugEj0ep7rvKYoyc0u-DOBDdZar1sudWe5fw_54gEy-HKQa_hWTJCmTygLNe-OQvyINrVCtf4dM_bICOKUbA127fBKnQ9iXVFWtZfMbTnEthAPY_YKc74ynBQ3-YYUPggnsAdBawO4Soyz8VMeacOH0oAJ9cn40f2IrbJNCq75EHJz0WlFEyB6691-Yb3JuERyeQ1pCrL0YYqsI0BNpaLLIQr23QlyPHC79sN3YdLROSyWGGHg3j3-lk5jFuqGH5M')"></div>
</div>
<!-- Header -->
<div class="text-center mb-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-xs">Chào mừng trở lại!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Cùng tiếp tục hành trình học tập nào.</p>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">mail</span>
<input class="w-full h-[48px] pl-12 pr-4 bg-surface-container-lowest border border-on-surface-variant rounded focus:border-2 focus:border-primary-container transition-all font-body-md text-body-md text-on-background placeholder:text-on-surface-variant/50" placeholder="Email" type="email">
</div>
<!-- Password Input -->
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full h-[48px] pl-12 pr-12 bg-surface-container-lowest border border-on-surface-variant rounded focus:border-2 focus:border-primary-container transition-all font-body-md text-body-md text-on-background placeholder:text-on-surface-variant/50" id="password-input" placeholder="Mật khẩu" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-[-8px]">
<a class="font-label-bold text-label-bold text-primary hover:underline underline-offset-2" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary Login Button -->
<button class="w-full h-[48px] mt-xs bg-primary-container text-on-primary-container font-headline-md text-[18px] leading-[24px] font-bold rounded-full border-b-[3px] border-b-primary hover:translate-y-[1px] hover:border-b-[2px] active:translate-y-[3px] active:border-b-0 transition-all flex items-center justify-center" type="submit">
                Đăng nhập
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 my-xs">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Hoặc</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Google Login Button -->
<button class="w-full h-[48px] bg-surface-container-lowest text-on-background font-label-bold text-label-bold rounded-full border border-outline hover:bg-surface-variant active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Đăng nhập với Google
            </button>
</form>
<!-- Footer Links -->
<div class="mt-lg text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Chưa có tài khoản?</span>
<a class="font-label-bold text-label-bold text-primary ml-1 hover:underline underline-offset-2" href="#">Đăng ký</a>
</div>
</main>
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('password-toggle-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
