<style>
        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .jar-container {
            position: relative;
            width: 100%;
            padding-bottom: 100%; /* Square aspect ratio */
            border-radius: theme('borderRadius.xl');
            overflow: hidden;
            background-color: theme('colors.surface-container');
            box-shadow: 0 4px 12px rgba(33, 27, 16, 0.05);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .jar-container:hover {
             transform: translateY(-4px) scale(1.02);
        }

        .jar-icon-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        .jar-icon {
            font-size: 64px;
            margin-bottom: theme('spacing.xs');
        }

        .btn-primary {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            border-radius: theme('borderRadius.full');
            padding: theme('spacing.sm') theme('spacing.xl');
            font-family: theme('fontFamily.label-bold');
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            border-bottom: 4px solid #6e3900; /* Darker primary for tactile feel */
            transition: transform 0.1s ease-in-out, border-bottom-width 0.1s ease-in-out;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            display: inline-block;
        }

        .btn-primary:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: theme('colors.surface-variant');
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .step-dot.active {
            background-color: theme('colors.primary');
            transform: scale(1.5);
            width: 24px;
            border-radius: theme('borderRadius.full');
        }
        
        /* Floating animation for jars */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        .float-animation-delay-1 {
            animation: float 4.5s ease-in-out infinite 0.5s;
        }
        .float-animation-delay-2 {
            animation: float 5s ease-in-out infinite 1s;
        }

    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="px-container-margin py-lg flex flex-col items-center justify-between">
<!-- Top Action (Skip) -->
<div class="w-full flex justify-end mb-md">
<button class="text-on-surface-variant font-label-bold text-label-bold hover:text-primary transition-colors cursor-pointer">
             Bỏ qua
         </button>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-md w-full relative z-10">
<!-- Illustration Area: 3 Jars -->
<div class="w-full grid grid-cols-3 gap-gutter mb-xl relative">
<!-- Jar 1: Spend (Orange) -->
<div class="flex flex-col items-center float-animation">
<div class="jar-container" style="background-color: theme('colors.primary-container');">
<div class="jar-icon-wrapper text-on-primary-container">
<span class="material-symbols-outlined jar-icon" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</div>
</div>
<span class="mt-sm font-label-bold text-label-bold text-on-surface">Tiêu dùng</span>
</div>
<!-- Jar 2: Save (Green) -->
<div class="flex flex-col items-center float-animation-delay-1 mt-md">
<div class="jar-container" style="background-color: theme('colors.secondary-container'); box-shadow: 0 0 20px rgba(0, 110, 28, 0.2);">
<div class="jar-icon-wrapper text-on-secondary-container">
<span class="material-symbols-outlined jar-icon" style="font-variation-settings: 'FILL' 1;">savings</span>
</div>
</div>
<span class="mt-sm font-label-bold text-label-bold text-on-surface">Tiết kiệm</span>
</div>
<!-- Jar 3: Share (Purple) -->
<div class="flex flex-col items-center float-animation-delay-2">
<div class="jar-container" style="background-color: theme('colors.tertiary-container');">
<div class="jar-icon-wrapper text-on-tertiary-container">
<span class="material-symbols-outlined jar-icon" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<span class="mt-sm font-label-bold text-label-bold text-on-surface">Chia sẻ</span>
</div>
<!-- Decorative background blob -->
<div class="absolute inset-0 bg-surface-container-high rounded-full blur-3xl opacity-50 -z-10 transform scale-150 translate-y-1/4"></div>
</div>
<!-- Typography -->
<div class="text-center mb-xl w-full">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-sm">Quy tắc 3 hũ tiền</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant px-sm">
                Học cách chia tiền vào 3 hũ: Tiêu dùng, Tiết kiệm và Chia sẻ.
            </p>
</div>
</div>
<!-- Bottom Actions Area -->
<div class="w-full flex flex-col items-center pb-md">
<!-- Step Indicators -->
<div class="flex items-center gap-xs mb-lg">
<div class="step-dot"></div>
<div class="step-dot active"></div>
<div class="step-dot"></div>
<div class="step-dot"></div>
<div class="step-dot"></div>
<div class="step-dot"></div>
</div>
<!-- Next Button -->
<button class="btn-primary">
            Tiếp
        </button>
</div>
</body></html>
