<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>GrowWise - Chọn Vai Trò</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#ff8c00",
                        "inverse-primary": "#ffb77d",
                        "surface-container-high": "#f3e6d4",
                        "on-error": "#ffffff",
                        "tertiary-container": "#b29bff",
                        "tertiary-fixed-dim": "#cdbdff",
                        "on-secondary-fixed-variant": "#005313",
                        "surface-variant": "#eee1cf",
                        "inverse-on-surface": "#fcefdd",
                        "surface-dim": "#e5d8c6",
                        "on-primary-fixed": "#2f1500",
                        "on-background": "#211b10",
                        "on-secondary-container": "#0a7320",
                        "on-tertiary-fixed": "#20005f",
                        "secondary-fixed": "#99f894",
                        "on-surface": "#211b10",
                        "on-primary": "#ffffff",
                        "secondary": "#006e1c",
                        "primary-fixed": "#ffdcc3",
                        "error-container": "#ffdad6",
                        "secondary-container": "#96f592",
                        "on-secondary-fixed": "#002204",
                        "on-error-container": "#93000a",
                        "surface": "#fff8f2",
                        "secondary-fixed-dim": "#7edb7b",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#904d00",
                        "surface-bright": "#fff8f2",
                        "tertiary": "#6833ea",
                        "on-primary-container": "#623200",
                        "tertiary-fixed": "#e8deff",
                        "outline": "#897362",
                        "surface-container": "#f9ecda",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#564334",
                        "on-primary-fixed-variant": "#6e3900",
                        "outline-variant": "#ddc1ae",
                        "inverse-surface": "#362f23",
                        "on-tertiary-container": "#4600bb",
                        "error": "#ba1a1a",
                        "primary": "#904d00",
                        "surface-container-highest": "#eee1cf",
                        "background": "#fff8f2",
                        "primary-fixed-dim": "#ffb77d",
                        "on-tertiary-fixed-variant": "#4f00d0",
                        "surface-container-low": "#fff2e0"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "48px",
                        "gutter": "16px",
                        "base": "4px",
                        "lg": "32px",
                        "sm": "16px",
                        "xs": "8px",
                        "md": "24px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "display-lg": ["Nunito Sans", "sans-serif"],
                        "label-bold": ["Nunito Sans", "sans-serif"],
                        "label-sm": ["Nunito Sans", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "headline-md": ["Nunito Sans", "sans-serif"],
                        "body-lg": ["Nunito Sans", "sans-serif"],
                        "display-lg-mobile": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                        "label-bold": ["14px", {"lineHeight": "20px", "fontWeight": "800"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "800"}],
                        "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "38px", "fontWeight": "900"}]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .tactile-button {
                @apply active:translate-y-[2px] transition-all duration-150;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Top Navigation / Back Button (Suppressed full nav for transactional screen) -->
<header class="absolute top-0 left-0 w-full p-container-margin z-10 flex justify-start">
<button aria-label="Quay lại" class="w-[48px] h-[48px] rounded-full bg-surface shadow-[0_2px_8px_rgba(33,27,16,0.05)] border border-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors tactile-button">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-xl w-full max-w-lg mx-auto relative z-0">
<!-- Header Text -->
<div class="text-center mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mb-xs tracking-tight">Bạn là ai?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Hãy chọn vai trò để bắt đầu trải nghiệm</p>
</div>
<!-- Role Selection Cards -->
<div class="flex flex-col w-full gap-lg">
<!-- Child Card -->
<button class="group relative w-full bg-surface-container rounded-lg p-lg flex items-center justify-start gap-md border-2 border-transparent hover:border-primary-container transition-all duration-300 tactile-button shadow-[0_8px_24px_rgba(255,140,0,0.08)] hover:shadow-[0_12px_32px_rgba(255,140,0,0.15)] overflow-hidden">
<!-- Inner Glow Effect -->
<div class="absolute inset-0 bg-gradient-to-r from-primary-container/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="w-[80px] h-[80px] rounded-full bg-primary-container flex items-center justify-center shadow-inner relative z-10">
<span class="material-symbols-outlined text-[40px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<div class="flex flex-col text-left relative z-10">
<span class="font-headline-md text-headline-md text-on-background">Bé</span>
<span class="font-body-md text-body-md text-on-surface-variant">Khám phá và học hỏi</span>
</div>
<!-- Indicator Arrow -->
<div class="ml-auto w-10 h-10 rounded-full bg-surface flex items-center justify-center opacity-0 group-hover:opacity-100 transform translate-x-4 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined text-primary-container">arrow_forward</span>
</div>
</button>
<!-- Parent Card -->
<button class="group relative w-full bg-surface-container rounded-lg p-lg flex items-center justify-start gap-md border-2 border-transparent hover:border-tertiary-container transition-all duration-300 tactile-button shadow-[0_8px_24px_rgba(178,155,255,0.08)] hover:shadow-[0_12px_32px_rgba(178,155,255,0.15)] overflow-hidden backdrop-blur-[12px]">
<!-- Inner Glow Effect -->
<div class="absolute inset-0 bg-gradient-to-r from-tertiary-container/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<div class="w-[80px] h-[80px] rounded-full bg-tertiary-container flex items-center justify-center shadow-inner relative z-10">
<span class="material-symbols-outlined text-[40px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="flex flex-col text-left relative z-10">
<span class="font-headline-md text-headline-md text-on-background">Phụ huynh</span>
<span class="font-body-md text-body-md text-on-surface-variant">Quản lý và đồng hành</span>
</div>
<!-- Indicator Arrow -->
<div class="ml-auto w-10 h-10 rounded-full bg-surface flex items-center justify-center opacity-0 group-hover:opacity-100 transform translate-x-4 group-hover:translate-x-0 transition-all duration-300">
<span class="material-symbols-outlined text-tertiary-container">arrow_forward</span>
</div>
</button>
</div>
</main>
<!-- Subtle Background Decoration Elements -->
<div class="fixed top-[-10%] right-[-10%] w-[300px] h-[300px] bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[300px] h-[300px] bg-tertiary-container/5 rounded-full blur-3xl pointer-events-none"></div>
</body></html>
