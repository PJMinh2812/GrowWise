<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowWise · Banner khảo sát</title>
<style>
  :root{
    --c1:#FBA53A;        /* gradient trái */
    --c2:#E2750F;        /* gradient phải */
    --blob-light:#FFC273;/* sóng sáng     */
    --blob-deep:#B85A06; /* sóng đậm      */
    --frame:#FFF3D6;     /* viền khung icon */
    --icon:#D9731A;      /* màu icon      */
    --cta:#FFFFFF;       /* nút bấm       */
    --cta-dark:#E6D9C2;  /* bóng nút      */
    --cta-text:#C75A0A;  /* chữ trên nút  */
    --title:#FFFFFF;
    --eyebrow:rgba(255,255,255,.9);
    --sub:rgba(255,255,255,.95);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#F3EEE6;font-family:"Nunito","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px}
  .frame-phone{width:100%;max-width:420px}

  /* ===================== BANNER ===================== */
  .banner{
    position:relative;width:100%;border-radius:24px;overflow:hidden;
    background:linear-gradient(115deg,var(--c1),var(--c2));
    display:flex;align-items:center;gap:16px;
    padding:20px 18px;min-height:150px;
    box-shadow:0 10px 26px rgba(200,110,20,.22);
  }
  .banner .waves{position:absolute;inset:0;width:100%;height:100%}

  .frame{
    position:relative;z-index:2;flex:0 0 auto;
    width:70px;height:70px;border-radius:20px;background:#fff;
    border:4px solid var(--frame);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,.15);
  }
  .frame svg{width:34px;height:34px;color:var(--icon)}

  .content{position:relative;z-index:2;flex:1;min-width:0}
  .eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--eyebrow);text-transform:uppercase}
  .content h2{font-size:26px;font-weight:900;color:var(--title);line-height:1;margin:3px 0 5px;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  .content p{font-size:13.5px;font-weight:700;color:var(--sub);margin-bottom:12px;max-width:230px}
  .cta{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--cta);color:var(--cta-text);
    border:none;border-radius:24px;padding:11px 20px;
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    box-shadow:0 4px 0 var(--cta-dark);
  }
  .cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-dark)}
  .cta svg{width:16px;height:16px}

  .close{
    position:absolute;top:12px;right:12px;z-index:3;
    width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.25);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;
  }
  .close:hover{background:rgba(255,255,255,.4)}
</style>
</head>
<body>
  <div class="frame-phone">
    <div class="banner">
      <!-- sóng nền trang trí -->
      <svg class="waves" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <path d="M400,0 H230 C290,55 230,95 300,120 C350,138 380,150 400,160 Z" fill="var(--blob-deep)" opacity=".55"/>
        <path d="M400,160 H250 C310,120 260,70 330,45 C370,30 390,15 400,0 Z" fill="var(--blob-light)" opacity=".7"/>
        <path d="M400,30 C320,55 360,110 290,140 C350,150 400,150 400,150 Z" fill="#fff" opacity=".12"/>
        <circle cx="360" cy="34" r="6" fill="#fff" opacity=".25"/>
        <circle cx="386" cy="70" r="4" fill="#fff" opacity=".22"/>
        <circle cx="300" cy="22" r="3" fill="#fff" opacity=".3"/>
        <circle cx="40" cy="140" r="5" fill="#fff" opacity=".18"/>
      </svg>

      <button class="close" aria-label="Đóng">×</button>

      <div class="frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="4" width="14" height="17" rx="2"/>
          <path d="M9 4V3h6v1M8 10h8M8 14h6"/>
        </svg>
      </div>

      <div class="content">
        <div class="eyebrow">Khảo sát nhanh</div>
        <h2>Khảo sát ngắn</h2>
        <p>Giúp chúng tôi cải thiện trải nghiệm — chỉ 1 phút.</p>
        <button class="cta">
          Mở khảo sát
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
