            100% { transform: scale(1); opacity: 1; }

            transform: translateY(-2px);

        }

</div>

<div class="text-center mb-lg spring-anim" style="animation-delay: 0.2s;">
<h1 class="font-headline-md text-headline-md text-primary mb-xs">Ước mơ đầu tiên của bé</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Hãy đặt một mục tiêu để cùng nhau phấn đấu nhé!</p>
</div>
<!-- Form Layout (Bento-inspired) -->
<div class="flex-grow flex flex-col gap-sm spring-anim" style="animation-delay: 0.3s;">
<!-- Input 1: Dream Name -->
<div class="bg-surface-container rounded-[24px] p-sm border border-outline-variant/30 relative">
<label class="font-label-bold text-label-bold text-on-surface-variant block mb-2" for="dream_name">Tên ước mơ</label>
<div class="flex items-center gap-xs bg-surface rounded-[16px] p-2 border border-[#564334] focus-within:border-primary-container focus-within:border-2 transition-all">
<span class="material-symbols-outlined text-outline ml-2">sports_esports</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="dream_name" placeholder="VD: Xe đạp, Đồ chơi lego..." type="text">
</div>
</div>

<div class="bg-surface-container rounded-[24px] p-sm border border-outline-variant/30">

<button class="w-12 h-12 rounded-full bg-surface border-2 border-primary-container flex items-center justify-center text-2xl bouncy-hover">🚲</button>
<button class="w-12 h-12 rounded-full bg-surface border border-outline-variant flex items-center justify-center text-2xl opacity-70 hover:opacity-100 bouncy-hover">🤖</button>

</div>
</div>

<label class="font-label-bold text-label-bold text-on-surface-variant block mb-2" for="dream_cost">Giá xu</label>

<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
