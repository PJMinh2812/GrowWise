workflows:
  ios-simulator:
    name: iOS Simulator (Appetize.io)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - growwise_env

    scripts:
      - name: Create .env file
        script: |
          printf "SUPABASE_URL=%s\n" "$SUPABASE_URL" > mobile/.env
          printf "SUPABASE_ANON_KEY=%s\n" "$SUPABASE_ANON_KEY" >> mobile/.env
          printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" >> mobile/.env
          printf "GROQ_API_KEY=%s\n" "$GROQ_API_KEY" >> mobile/.env
          printf "API_BASE_URL=%s\n" "$API_BASE_URL" >> mobile/.env
          printf "FACE_PLUS_PLUS_API_KEY=%s\n" "$FACE_PLUS_PLUS_API_KEY" >> mobile/.env
          printf "FACE_PLUS_PLUS_API_SECRET=%s\n" "$FACE_PLUS_PLUS_API_SECRET" >> mobile/.env

      - name: Restore firebase_options.dart
        script: |
          echo "$FIREBASE_OPTIONS" | base64 --decode > mobile/lib/firebase_options.dart

      - name: Flutter pub get
        script: flutter pub get
        working_directory: mobile

      - name: Pod install
        script: pod install
        working_directory: mobile/ios

      - name: Build iOS Simulator
        script: |
          flutter build ios --simulator --no-codesign
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app
        working_directory: mobile

    artifacts:
      - mobile/build/ios/iphonesimulator/Runner.app.zip

    publishing:
      email:
        recipients:
          - parkjeaminh2812@gmail.com
        notify:
          success: true
          failure: true
