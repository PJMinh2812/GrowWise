workflows:
  ios-simulator:
    name: iOS Simulator (Appetize.io)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - growwise_env

    scripts:
      - name: Create .env file
        script: |
          cat > mobile/.env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          API_BASE_URL=$API_BASE_URL
          FACE_PLUS_PLUS_API_KEY=$FACE_PLUS_PLUS_API_KEY
          FACE_PLUS_PLUS_API_SECRET=$FACE_PLUS_PLUS_API_SECRET
          EOF

      - name: Flutter pub get
        script: flutter pub get
        working_directory: mobile

      - name: Pod install
        script: pod install
        working_directory: mobile/ios

      - name: Build iOS Simulator
        script: |
          flutter build ios --simulator --no-codesign
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app
        working_directory: mobile

    artifacts:
      - mobile/build/ios/iphonesimulator/Runner.app.zip

    publishing:
      email:
        recipients:
          - parkjeaminh2812@gmail.com
        notify:
          success: true
          failure: true
